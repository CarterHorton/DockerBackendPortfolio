<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #a3d8f4 0%, #dff4ff 100%);
      font-family: Arial, sans-serif;
      color: #000;
    }
    .error-panel {
      background: #ffffffdd;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      padding: 48px 56px;
      text-align: center;
      max-width: 540px;
      width: 90%;
    }
    .error-panel h1 {
      margin: 0 0 16px;
      font-size: 5rem;
      letter-spacing: -0.06em;
    }
    .error-panel p {
      margin: 0 0 24px;
      font-size: 1.35rem;
      line-height: 1.6;
      color: #111;
    }
    .error-panel a {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 28px;
      background: #0e3a66;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .error-panel a:hover {
      background: #0b2a4d;
    }
  </style>
</head>
<body>
  <div class="error-panel">
    <h1>404</h1>
    <p>Sorry, the page you are looking for cannot be found. It may have been moved or deleted.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
